<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0b0912" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html { background: #f6f3f0; }
      html.app-loading #root > .static-page { display: none; }
    </style>
    <script>
      // Run before the body can paint; React replaces the static fallback.
      document.documentElement.classList.add('app-loading');
      // Restore readable content if the application bundle fails to load.
      window.setTimeout(() => {
        document.documentElement.classList.remove('app-loading');
      }, 10000);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍒</text></svg>"
    />
    <title>CherryBit — Frontend Engineering</title>
    <meta name="description" content="CherryBit builds and modernises frontend applications with React, Angular and TypeScript. Expertise in real-time systems, complex data and reliable interfaces." />
    <link rel="canonical" href="https://www.cherry-bit.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CherryBit" />
    <meta property="og:title" content="CherryBit — Frontend Engineering" />
    <meta property="og:description" content="Frontend engineering for complex products. React, Angular, TypeScript, real-time systems and reliable interfaces." />
    <meta property="og:url" content="https://www.cherry-bit.com/" />
    <meta property="og:image" content="https://www.cherry-bit.com/cherrybit-logo.png" />
    <meta property="og:image:alt" content="CherryBit logo" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://www.cherry-bit.com/#organization",
        "name": "CherryBit",
        "url": "https://www.cherry-bit.com/",
        "logo": "https://www.cherry-bit.com/cherrybit-logo.png"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
